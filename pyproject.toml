# src/pico_elevationmap/ — PICO 高程建图框架
# ROS-free 核心 + cupy（GPU 实时）后端；torch 批量后端暂缓（Phase 3）；
# 包装 elevation_mapping_cupy_core。设计文档见 docs/design.md（历史设计稿）。

[project]
name = "pico-elevationmap"
version = "0.4.0"
description = "PICO elevation mapping: ROS-free core with a CUDA/cupy backend"
readme = "README.md"
# CI 只测 Python 3.12；3.10/3.11 暂时保留在元数据范围内以兼容上游依赖，
# 但在 CI matrix 出现前不作为受支持版本（见 docs/open-source-readiness.md）。
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "PICO4robot contributors" }]
keywords = [
  "elevation-mapping",
  "robotics",
  "cuda",
  "cupy",
  "ros2",
  "quadruped",
  "humanoid",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
]
dependencies = [
  "elevation-mapping-cupy-core",
  "cupy-cuda12x",
  "numpy",
  "pyyaml",
  "rosbags",
]

[project.optional-dependencies]
# ROS2 桥接为可选能力：rclpy / sensor_msgs / grid_map_msgs 由系统 ROS2 安装
# 提供（pip 无法安装），此 extra 仅作语义标记与纯 python 依赖挂载点；
# 核心包（pico_elevationmap）零 ROS 依赖，uv sync 不带 extra 即可。
ros = []
# 无系统 CUDA toolkit 的机器：NVRTC 需要 CUDA 12.x headers + nvrtc 库。
# 只装 cudart/nvrtc 两个组件，比完整的 cupy-cuda12x[ctk] 轻很多。
cuda = ["cuda-toolkit[cudart,nvrtc]>=12,<14"]
# RealSense D435i 等深度相机直连（src/pico_elevationmap/live/realsense_live.py）。
realsense = ["pyrealsense2>=2.55,<3"]

[project.urls]
Homepage = "https://github.com/PICO4robot/PICO-elevationmap"
Documentation = "https://github.com/PICO4robot/PICO-elevationmap/blob/main/docs/README.md"
Repository = "https://github.com/PICO4robot/PICO-elevationmap"
Issues = "https://github.com/PICO4robot/PICO-elevationmap/issues"
Changelog = "https://github.com/PICO4robot/PICO-elevationmap/blob/main/CHANGELOG.md"

[project.scripts]
pico-elevationmap = "pico_elevationmap.cli:main"
pico-elevationmap-ros = "pico_elevationmap_ros.node:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pico_elevationmap*", "pico_elevationmap_ros*"]

[tool.setuptools.package-data]
pico_elevationmap = ["py.typed"]
"pico_elevationmap.configs" = ["*.yaml"]

[tool.setuptools.data-files]
"share/pico-elevationmap" = ["THIRD_PARTY_NOTICES.md", "CHANGELOG.md"]

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# 默认使用 PyPI（uv 内置默认索引）；不再配置国内镜像，避免 lock 绑死单一镜像。
# cupy-cuda12x 及其 nvidia-* 依赖在 PyPI 均有收录；pytorch explicit index 待
# Phase 3 引入 torch 后端后按需补回。
[tool.uv.sources]
# 锁 git rev 照 PICO-rl 锁 mjlab 的写法；上游 API 变动跟随升级（dependency bumps
# are manual PRs）。上游 pyproject 完整可直接 git 安装，无需 PyPI 回退。
elevation-mapping-cupy-core = { git = "https://github.com/leggedrobotics/elevation_mapping_cupy_core.git", rev = "7a79a6655952aab2e0dd30d81420adbb2e64134a" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "UP007",  # use X | Y instead of Optional[X] — keep explicit for clarity
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pico_elevationmap", "pico_elevationmap_ros"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_ros: 真实 ROS2 环境集成测试（无 ROS 时自动 skip，桥接逻辑由桩单测覆盖）",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.12",
]
