# D435i + RoboSense Airy 双源配置（静态相机/雷达，ROS2 LiDAR 输入）。
# 用法：uv run python -m scripts.tools.realsense_live \
#   --config scripts/tools/configs/realsense_lidar.yaml --lidar-topic /rslidar_points
map:
  resolution: 0.05
  map_length: 12.0
  mahalanobis_thresh: 2.5
  min_valid_distance: 0.2
  max_height_range: 2.0
  max_ray_length: 8.0

sources:
  depth:
    sensor_type: depth_camera
    noise_coefficient: 0.002
    min_range: 0.15
    max_range: 6.0
  lidar:
    sensor_type: laser
    noise_coefficient: 0.005
    min_range: 0.5
    max_range: 20.0

plugins:
  min_filter:
    enable: true
    layer_name: min_filter
    fill_nan: false
    is_height_layer: true
    extra_params:
      dilation_size: 2
      iteration_n: 5
  smooth_filter:
    enable: true
    layer_name: smooth
    fill_nan: false
    is_height_layer: true
    extra_params:
      input_layer_name: min_filter
  geo_slope:
    enable: true
    layer_name: slope
    fill_nan: false
    is_height_layer: false
    extra_params:
      input_layer_name: smooth
  geo_traversability:
    enable: true
    layer_name: traversability_geo
    fill_nan: false
    is_height_layer: false
    extra_params:
      input_layer_name: smooth
      slope_thresh: 0.5
      roughness_thresh: 0.05
      roughness_window: 5
