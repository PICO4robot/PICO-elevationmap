# D435i + Livox Mid-360 双源配置（静态/台架验证）。
# 用法（Livox CustomMsg）：
#   .venv-ros/bin/python -m pico_elevationmap.live.realsense_live \
#     --config src/pico_elevationmap/configs/livox_mid360.yaml \
#     --lidar-topic /livox/lidar --lidar-msg-type custom
# 若驱动已输出 PointCloud2（xfer_format=0），把 --lidar-msg-type 改为 pointcloud2。
map:
  resolution: 0.05
  map_length: 12.0
  mahalanobis_thresh: 2.5
  min_valid_distance: 0.2
  max_height_range: 2.0
  max_ray_length: 8.0

sources:
  depth:
    sensor_type: depth_camera
    noise_coefficient: 0.002
    min_range: 0.15
    max_range: 6.0
  lidar:
    sensor_type: laser
    noise_coefficient: 0.005
    min_range: 0.5
    max_range: 40.0

plugins:
  min_filter:
    enable: true
    layer_name: min_filter
    fill_nan: false
    is_height_layer: true
    extra_params:
      dilation_size: 2
      iteration_n: 5
  smooth_filter:
    enable: true
    layer_name: smooth
    fill_nan: false
    is_height_layer: true
    extra_params:
      input_layer_name: min_filter
  geo_slope:
    enable: true
    layer_name: slope
    fill_nan: false
    is_height_layer: false
    extra_params:
      input_layer_name: smooth
  geo_traversability:
    enable: true
    layer_name: traversability_geo
    fill_nan: false
    is_height_layer: false
    extra_params:
      input_layer_name: smooth
      slope_thresh: 0.5
      roughness_thresh: 0.05
      roughness_window: 5
